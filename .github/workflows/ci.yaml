name: ci

on:
  pull_request:
    branches:
      - main
  push:
    tags:
      - "*"
  workflow_dispatch:
    inputs:
      logLevel:
        description: "Log level"
        required: true
        default: "warning"

jobs:
  ci:
    name: ci
    # macos-13/14 are retired; macos-15 arm64 can be congested — use macos-26 pool.
    # https://github.com/actions/runner-images/blob/main/images/macos/macos-26-Readme.md
    runs-on: macos-26
    env:
      DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: DeterminateSystems/nix-installer-action@v14
        with:
          extra-conf: |
            sandbox = true
            sandbox-fallback = false

      - name: Nix version
        run: nix --version

      - name: Show Nix config
        run: nix config show

      - name: Xcode version
        run: /Applications/Xcode.app/Contents/Developer/usr/bin/xcodebuild -version

      # See ${workspace}/nix/overlays/xcode.md
      - name: Set up Xcode in Nix store
        run: |
          set -euo pipefail
          XCODE_APP=$(realpath /Applications/Xcode.app)
          NIX_STORE_PATH=$(nix-store --add-fixed --recursive sha256 "$XCODE_APP")
          echo "SUBX_XCODE_STORE=$NIX_STORE_PATH" >> "$GITHUB_ENV"
          mkdir -p "/nix/var/nix/gcroots/per-user/$USER"
          ln -sf "$NIX_STORE_PATH" "/nix/var/nix/gcroots/per-user/$USER/xcode-ci"
          nix-store --query --hash "$NIX_STORE_PATH"

      - uses: DeterminateSystems/magic-nix-cache-action@v8

      - name: Determine version
        id: version
        run: |
          case "${GITHUB_REF}" in
          refs/tags/*)
            VERSION=${GITHUB_REF#refs/tags/}
            ;;
          *)
            VERSION=develop
            ;;
          esac

          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo ${VERSION}

      - name: Build
        run: |
          VERSION=${{ steps.version.outputs.version }}
          echo \"$VERSION\" > nix/utils/default/version.nix
          nix build -v

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          if-no-files-found: error
          path: |
            result/*.tar.gz

      - name: Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          fail_on_unmatched_files: true
          files: |
            result/*.tar.gz